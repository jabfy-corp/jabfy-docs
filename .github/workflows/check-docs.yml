name: Check docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  links:
    name: Liens internes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check relative links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress '**/*.md'
          fail: true
